<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>GEX Terminal</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://unpkg.com/lightweight-charts@4.1.1/dist/lightweight-charts.standalone.production.js"></script>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #06080c;
  --bg2: #0b0e14;
  --bg3: #10141c;
  --bg4: #161b26;
  --border: #1c2230;
  --border2: #262e3e;
  --t1: #dce0e8;
  --t2: #8892a4;
  --t3: #4a5568;
  --green: #00dc82;
  --green2: #00b86b;
  --green-bg: rgba(0,220,130,0.07);
  --green-bd: rgba(0,220,130,0.20);
  --red: #ff4060;
  --red2: #d63050;
  --red-bg: rgba(255,64,96,0.07);
  --red-bd: rgba(255,64,96,0.20);
  --amber: #ffb020;
  --amber-bg: rgba(255,176,32,0.07);
  --blue: #3890ff;
  --blue-bg: rgba(56,144,255,0.06);
  --purple: #a78bfa;
  --mono: 'IBM Plex Mono', 'Consolas', monospace;
  --sans: 'Outfit', system-ui, sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html{height:100%}
body{font-family:var(--mono);background:var(--bg);color:var(--t1);font-size:13px;line-height:1.5;
  min-height:100%;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;
  scrollbar-width:thin;scrollbar-color:var(--border2) transparent;
  font-variant-numeric:tabular-nums}
body::-webkit-scrollbar{width:4px}
body::-webkit-scrollbar-track{background:transparent}
body::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}

/* LOADING */
#loading{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;z-index:9999;transition:opacity .3s,visibility .3s}
#loading.hidden{opacity:0;visibility:hidden;pointer-events:none}
.spin{width:24px;height:24px;border:2px solid var(--border2);border-top-color:var(--blue);border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#loading .lt{color:var(--t3);font-size:11px;letter-spacing:.5px}

/* HEADER */
.hdr{position:sticky;top:0;z-index:100;background:var(--bg2);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 12px;height:48px;gap:10px}
.hdr-logo{font-family:var(--sans);font-weight:800;font-size:14px;letter-spacing:-.3px;color:var(--t2)}
.hdr-logo b{color:var(--blue)}
.hdr-tabs{display:flex;gap:2px;background:var(--bg3);border-radius:3px;padding:2px}
.hdr-tab{font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.5px;padding:4px 14px;border-radius:2px;border:none;background:none;color:var(--t3);cursor:pointer;min-height:44px;display:flex;align-items:center}
.hdr-tab.active{background:var(--blue);color:var(--bg)}
.hdr-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.hdr-desktop{font-family:var(--mono);font-size:16px;color:var(--t3);text-decoration:none;min-width:44px;min-height:44px;display:flex;align-items:center;justify-content:center}

/* CARDS */
.content{padding:10px;display:flex;flex-direction:column;gap:10px;padding-bottom:80px}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:6px;padding:12px 14px}
.card-title{font-size:9px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--t3);margin-bottom:8px;display:flex;align-items:center;gap:6px}
.card-title::before{content:'';display:inline-block;width:5px;height:5px;border-radius:1px}
.card-title.blue::before{background:var(--blue)}
.card-title.green::before{background:var(--green)}
.card-title.red::before{background:var(--red)}
.card-title.amber::before{background:var(--amber)}
.card-title.purple::before{background:var(--purple)}

/* HERO */
.hero-btc{font-family:var(--sans);font-size:28px;font-weight:800;letter-spacing:-1px;line-height:1}
.hero-etf{font-size:12px;color:var(--t2);margin-top:2px}
.hero-badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.badge{font-size:10px;font-weight:600;letter-spacing:.6px;padding:4px 10px;border-radius:3px;text-transform:uppercase}
.badge-pos{background:var(--green-bg);color:var(--green);border:1px solid var(--green-bd)}
.badge-neg{background:var(--red-bg);color:var(--red);border:1px solid var(--red-bd)}
.badge-neutral{background:var(--bg3);color:var(--t3);border:1px solid var(--border)}
.badge-blue{background:var(--blue-bg);color:var(--blue);border:1px solid rgba(56,144,255,.2)}
.badge-amber{background:var(--amber-bg);color:var(--amber);border:1px solid rgba(255,176,32,.2)}

/* KEY LEVELS */
.regime-banner{font-size:10px;padding:6px 10px;border-radius:4px;margin-bottom:10px;line-height:1.4}
.regime-banner.pos{background:var(--green-bg);color:var(--green);border:1px solid var(--green-bd)}
.regime-banner.neg{background:var(--red-bg);color:var(--red);border:1px solid var(--red-bd)}
.em-bar{position:relative;height:28px;border-radius:4px;background:var(--bg3);margin-bottom:10px;overflow:hidden}
.em-fill{position:absolute;top:0;bottom:0;border-radius:4px;opacity:.3}
.em-marker{position:absolute;top:0;bottom:0;width:2px;border-radius:1px}
.em-label{position:absolute;top:50%;transform:translateY(-50%);font-size:8px;font-weight:600;white-space:nowrap}
.level-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border)}
.level-row:last-child{border-bottom:none}
.level-dot{width:8px;height:8px;border-radius:2px;flex-shrink:0}
.level-name{font-size:11px;color:var(--t2);margin-left:8px;flex:1}
.level-price{font-size:12px;font-weight:600;letter-spacing:-.3px}
.level-dist{font-size:10px;color:var(--t3);margin-left:8px;min-width:48px;text-align:right}

/* DTE WINDOWS */
.dte-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media(max-width:400px){.dte-grid{grid-template-columns:1fr}}
.dte-card{background:var(--bg3);border:1px solid var(--border);border-radius:4px;padding:10px}
.dte-label{font-size:10px;font-weight:700;letter-spacing:.5px;color:var(--t1);margin-bottom:4px}
.dte-regime{font-size:9px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;margin-bottom:4px}
.dte-row{display:flex;justify-content:space-between;font-size:10px;color:var(--t2);line-height:1.8}
.dte-agree{color:var(--green);font-size:9px}

/* MACRO */
.macro-score{font-family:var(--sans);font-size:32px;font-weight:800;letter-spacing:-1px;line-height:1}
.macro-hdr{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.signal-row{display:flex;align-items:center;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border)}
.signal-row:last-child{border-bottom:none}
.signal-name{font-size:10px;color:var(--t2);flex:1}
.signal-score{font-size:11px;font-weight:600;min-width:60px;text-align:right}
.signal-cg{font-size:8px;color:var(--blue);margin-left:4px;font-weight:600;letter-spacing:.3px}
.dim{color:var(--t3)}

/* AI ANALYSIS */
.ai-content{font-size:12px;line-height:1.6;color:var(--t2)}
.ai-content strong{color:var(--t1);font-weight:600}
.ai-cross{margin-top:8px;padding:8px 10px;border-left:2px solid var(--blue);background:var(--blue-bg);border-radius:0 4px 4px 0}
.ai-cross-label{font-size:9px;font-weight:600;color:var(--blue);letter-spacing:.4px;margin-bottom:4px}
.ai-ts{font-size:9px;color:var(--t3);margin-bottom:6px}
.ai-spinner{display:flex;align-items:center;gap:8px;color:var(--t3);font-size:11px}

/* CHART */
.chart-wrap{position:relative;height:50vh;min-height:280px}
#tv-chart{width:100%;height:100%}
.tf-btns{display:flex;gap:4px;margin-bottom:8px}
.tf-btn{font-family:var(--mono);font-size:11px;font-weight:600;padding:6px 14px;border-radius:3px;border:1px solid var(--border);background:var(--bg3);color:var(--t3);cursor:pointer;min-height:44px;display:flex;align-items:center}
.tf-btn.active{background:var(--blue);color:var(--bg);border-color:var(--blue)}

/* SELECTORS */
.selectors{position:sticky;top:48px;z-index:99;background:var(--bg2);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;padding:6px 12px;overflow:hidden}
.selectors label{font-size:10px;color:var(--t3);font-weight:600;letter-spacing:.5px;flex-shrink:0}
.selectors select{font-family:var(--mono);font-size:16px;background:var(--bg3);color:var(--t1);border:1px solid var(--border2);border-radius:3px;padding:4px 8px;min-height:36px;min-width:0;flex:1 1 0;overflow:hidden;text-overflow:ellipsis}
.selectors #src-select{flex:0 0 auto;width:auto}

/* FOOTER */
.footer{padding:16px 14px;text-align:center;font-size:10px;color:var(--t3);border-top:1px solid var(--border);margin-top:10px}
.footer a{color:var(--t3);text-decoration:none}
.footer a:active{color:var(--blue)}

/* iOS form zoom prevention */
select,input,textarea{font-size:16px}
</style>
</head>
<body>

<div id="loading"><div class="spin"></div><div class="lt">LOADING</div></div>

<!-- HEADER -->
<div class="hdr">
  <div class="hdr-logo">GEX<b>TERM</b></div>
  <div class="hdr-tabs">
    <button class="hdr-tab active" data-ticker="IBIT" onclick="switchTicker('IBIT')">IBIT</button>
    <button class="hdr-tab" data-ticker="ETHA" onclick="switchTicker('ETHA')">ETHA</button>
  </div>
  <div class="hdr-right">
    <a href="/" class="hdr-desktop" title="Desktop version">&#x2197;</a>
  </div>
</div>

<div class="selectors">
  <label>DTE</label>
  <select id="dte-select" onchange="onDteChange()">
    <optgroup label="DTE Windows">
      <option value="0-3" selected>0-3d</option>
      <option value="4-7">4-7d</option>
      <option value="8-14">8-14d</option>
      <option value="15-30">15-30d</option>
      <option value="31-45">31-45d</option>
      <option value="0-100">ALL DTE</option>
    </optgroup>
    <optgroup label="Expiry Ranges" id="dte-range-group"></optgroup>
    <optgroup label="Single Expiry" id="dte-expiry-group"></optgroup>
  </select>
  <label>SRC</label>
  <select id="src-select" onchange="onSrcChange()">
    <option value="all" selected>ALL</option>
    <option value="ibit">IBIT</option>
    <option value="deribit">DERIBIT</option>
  </select>
</div>

<div class="content">

<!-- PRICE HERO -->
<div class="card" id="hero-card">
  <div class="hero-btc" id="hero-btc">—</div>
  <div class="hero-etf" id="hero-etf"></div>
  <div class="hero-badges" id="hero-badges"></div>
</div>

<!-- PRICE CHART -->
<div class="card" id="chart-card">
  <div class="card-title green">Price Chart</div>
  <div class="tf-btns" id="tf-btns">
    <button class="tf-btn" data-tf="15m" onclick="switchTF('15m')">15m</button>
    <button class="tf-btn active" data-tf="1h" onclick="switchTF('1h')">1h</button>
    <button class="tf-btn" data-tf="4h" onclick="switchTF('4h')">4h</button>
    <button class="tf-btn" data-tf="1d" onclick="switchTF('1d')">1d</button>
  </div>
  <div class="chart-wrap"><div id="tv-chart"></div></div>
</div>

<!-- POSITIONING OUTLOOK -->
<div class="card" id="outlook-card">
  <div class="card-title purple">Positioning Outlook</div>
  <div class="chart-wrap" style="height:35vh;min-height:220px"><canvas id="outlook-chart"></canvas></div>
</div>

<!-- KEY LEVELS -->
<div class="card" id="levels-card">
  <div class="card-title blue">Key Levels</div>
  <div id="regime-banner"></div>
  <div id="em-bar"></div>
  <div id="levels-rows"></div>
</div>

<!-- DTE WINDOW OVERVIEW -->
<div class="card" id="dte-card">
  <div class="card-title purple">DTE Windows</div>
  <div class="dte-grid" id="dte-grid"></div>
</div>

<!-- MACRO SCORE -->
<div class="card" id="macro-card">
  <div class="card-title amber">Macro Regime</div>
  <div class="macro-hdr" id="macro-hdr"></div>
  <div id="macro-signals"></div>
</div>

<!-- AI ANALYSIS -->
<div class="card" id="ai-card">
  <div class="card-title blue">AI Analysis</div>
  <div id="ai-body"><div class="ai-spinner"><div class="spin"></div>Waiting for analysis...</div></div>
</div>

</div><!-- .content -->

<!-- FOOTER -->
<div class="footer" id="footer">
  <a href="/">Desktop</a> &middot; <a href="/macro">Macro</a>
  <div id="footer-ts" style="margin-top:4px"></div>
</div>

<script>
// ── State ──
let currentTicker = 'IBIT';
let currentTF = '1h';
let tvChart = null, tvSeries = null, btcWs = null;
let priceLines = [];
let lastData = null;
let refreshTimer = null;
let analysisTimer = null;
let currentDte = '0-3';
let currentSource = 'all';
let outlookChart = null;
let expiryList = [];

// ── Helpers ──
const TICKER_WS = {IBIT:'btcusdt', ETHA:'ethusdt'};
const fmt = n => n >= 1000 ? `$${n.toLocaleString('en-US',{maximumFractionDigits:0})}` : `$${n.toFixed(2)}`;
const fB = n => `$${Math.round(n).toLocaleString()}`;
const fP = n => `${n >= 0 ? '+' : ''}${n.toFixed(1)}%`;
const fG = n => {const a=Math.abs(n);if(a>=1e6)return `${n<0?'-':''}$${(a/1e6).toFixed(1)}M`;if(a>=1e3)return `${n<0?'-':''}$${(a/1e3).toFixed(0)}K`;return `$${Math.round(n)}`};
const esc = s => {if(!s)return '';const d=document.createElement('div');d.textContent=s;return d.innerHTML};
function formatAiText(text){
  return esc(text).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\n/g,'<br>');
}

// ── Init ──
document.addEventListener('DOMContentLoaded', () => {
  initTV();
  loadAll();
  loadExpiryOptions();
  refreshTimer = setInterval(loadAll, 60000);
});

function switchTicker(tk){
  if(tk === currentTicker) return;
  currentTicker = tk;
  if(btcWs){btcWs.close();btcWs=null}
  document.querySelectorAll('.hdr-tab').forEach(b => b.classList.toggle('active', b.dataset.ticker === tk));
  lastData = null;
  loadAll();
  loadExpiryOptions();
}

function onDteChange(){
  currentDte = document.getElementById('dte-select').value;
  loadAll();
}

function onSrcChange(){
  currentSource = document.getElementById('src-select').value;
  if(lastData){
    renderHero(lastData);
    renderLevels(lastData);
    updateChartOverlay(lastData);
  }
}

function switchTF(tf){
  if(tf === currentTF) return;
  currentTF = tf;
  document.querySelectorAll('.tf-btn').forEach(b => b.classList.toggle('active', b.dataset.tf === tf));
  loadCandles();
}

// ── Load All Data ──
async function loadAll(){
  try{
    let dataResp;
    let isExpiryMode = false;

    if(currentDte.startsWith('exp:')){
      const expDate = currentDte.slice(4);
      dataResp = fetch(`/api/expiry-data?ticker=${currentTicker}&expiry=${expDate}`);
      isExpiryMode = true;
    } else if(currentDte.startsWith('range:')){
      const parts = currentDte.split(':');
      dataResp = fetch(`/api/expiry-data?ticker=${currentTicker}&from_date=${parts[1]}&to_date=${parts[2]}`);
      isExpiryMode = true;
    } else {
      const [minDte, maxDte] = currentDte.split('-').map(Number);
      dataResp = fetch(`/api/data?ticker=${currentTicker}&dte=${maxDte}&min_dte=${minDte}`);
    }

    const [dataRaw, outlookResp, macroResp, analysisResp] = await Promise.all([
      dataResp,
      fetch(`/api/outlook?ticker=${currentTicker}`),
      fetch(`/api/macro-regime?ticker=${currentTicker}`),
      fetch(`/api/analysis?ticker=${currentTicker}`)
    ]);

    let data = await dataRaw.json();
    const [outlook, macro, analysis] = await Promise.all([
      outlookResp.json(), macroResp.json(), analysisResp.json()
    ]);

    // Normalize expiry-data response to match /api/data shape
    if(isExpiryMode){
      data.btc_spot = data.spot_btc || 0;
      data.spot = data.spot || 0;
      data.levels = data.levels_btc || {};
      data.combined_levels_btc = data.levels_btc || {};
      data.deribit_available = data.deribit_available || false;
      data.timestamp = data.date || '';
      data.dealer_delta_profile = [];
      data.expirations = data.included_expiries || [];
      data.etf_flows = null;
      data.data_freshness = null;
      if(!data.levels.regime) data.levels.regime = data.regime || 'positive_gamma';
    }

    lastData = data;
    renderHero(data);
    renderLevels(data);
    renderDTEWindows(outlook);
    renderOutlook(outlook);
    renderMacro(macro);
    renderAnalysis(analysis);
    updateChartOverlay(data);

    document.getElementById('loading').classList.add('hidden');

    if(analysis && analysis.status === 'pending'){
      if(!analysisTimer) analysisTimer = setInterval(pollAnalysis, 30000);
    } else {
      if(analysisTimer){clearInterval(analysisTimer);analysisTimer=null}
    }

    // Update footer timestamp
    if(data.timestamp){
      document.getElementById('footer-ts').textContent = 'Last: ' + data.timestamp;
    }
  }catch(e){
    console.error('loadAll error:', e);
    document.getElementById('loading').classList.add('hidden');
    if(!lastData){
      document.getElementById('hero-btc').textContent = 'Error';
      document.getElementById('hero-etf').textContent = 'Tap to retry';
      document.getElementById('hero-card').onclick = () => {
        document.getElementById('hero-card').onclick = null;
        document.getElementById('loading').classList.remove('hidden');
        loadAll();
      };
    }
  }
}

async function pollAnalysis(){
  try{
    const r = await fetch(`/api/analysis?ticker=${currentTicker}`);
    const a = await r.json();
    if(a && a.status !== 'pending'){
      renderAnalysis(a);
      if(analysisTimer){clearInterval(analysisTimer);analysisTimer=null}
    }
  }catch(e){}
}

// ── Resolve Levels (respects source toggle) ──
function resolveLevels(data){
  const bps = data.btc_per_share;
  let cw, pw, gf, mp, support=[], resistance=[], regime, deltaFlips=[];

  if(currentSource === 'deribit' && data.deribit_available && data.deribit_levels_btc){
    const dl = data.deribit_levels_btc;
    cw=dl.call_wall; pw=dl.put_wall; gf=dl.gamma_flip; mp=dl.max_pain;
    regime=dl.regime; support=dl.support||[]; resistance=dl.resistance||[];
  } else if(currentSource === 'all' && data.deribit_available && data.combined_levels_btc){
    const cl = data.combined_levels_btc;
    cw=cl.call_wall; pw=cl.put_wall; gf=cl.gamma_flip; mp=cl.max_pain;
    regime=cl.regime; support=cl.support||[]; resistance=cl.resistance||[];
  } else {
    cw=data.levels.call_wall/bps; pw=data.levels.put_wall/bps;
    gf=data.levels.gamma_flip/bps; mp=data.levels.max_pain/bps;
    regime=data.levels.regime;
    support=(data.levels.support||[]).map(s=>s/bps);
    resistance=(data.levels.resistance||[]).map(r=>r/bps);
  }
  if(data.delta_flip_points) deltaFlips = data.delta_flip_points;
  return {cw, pw, gf, mp, regime, support, resistance, deltaFlips};
}

// ── Hero Card ──
function renderHero(data){
  const bps = data.btc_per_share;
  const spot = data.btc_spot || data.spot / bps;
  document.getElementById('hero-btc').textContent = fB(spot);
  document.getElementById('hero-etf').textContent = `${currentTicker} ${fmt(data.spot)}`;

  const lv = resolveLevels(data);
  const regime = lv.regime;
  let badges = '';

  // Regime badge
  const isPos = regime === 'positive_gamma';
  badges += `<span class="badge ${isPos?'badge-pos':'badge-neg'}">${isPos?'+GEX':'-GEX'} ${regime === 'positive_gamma' ? 'STABILIZING':'AMPLIFYING'}</span>`;

  // Confidence badge
  const conf = data.levels.positioning_confidence;
  if(conf != null){
    const cc = conf > 75 ? 'badge-pos' : conf > 40 ? 'badge-amber' : 'badge-neg';
    badges += `<span class="badge ${cc}">${Math.round(conf)}% CONF</span>`;
  }

  // ETF flow badge
  if(data.etf_flows){
    const fl = data.etf_flows;
    const dir = fl.direction === 'inflow' ? 'badge-pos' : 'badge-neg';
    badges += `<span class="badge ${dir}">${fl.direction === 'inflow'?'+':'-'}${fG(Math.abs(fl.daily_flow_dollars))} FLOW</span>`;
  }

  document.getElementById('hero-badges').innerHTML = badges;

  // Hide SRC selector when Deribit unavailable
  const srcSelect = document.getElementById('src-select');
  if(data.deribit_available){
    srcSelect.style.display = '';
    srcSelect.previousElementSibling.style.display = '';
  } else {
    srcSelect.style.display = 'none';
    srcSelect.previousElementSibling.style.display = 'none';
  }

  // Start/restart WebSocket for live price
  startCryptoWs(currentTF, TICKER_WS[currentTicker] || 'btcusdt');
}

// ── Key Levels ──
function renderLevels(data){
  const bps = data.btc_per_share;
  const spot = data.btc_spot || data.spot / bps;
  const lv = resolveLevels(data);
  const dist = p => ((p - spot) / spot * 100);

  // Regime banner
  const isPos = lv.regime === 'positive_gamma';
  document.getElementById('regime-banner').innerHTML =
    `<div class="regime-banner ${isPos?'pos':'neg'}">${isPos
      ? 'Positive gamma — dealer hedging dampens moves, creating mechanical support/resistance'
      : 'Negative gamma — dealer hedging amplifies moves, acceleration zones active'}</div>`;

  // Expected move bar
  let emHtml = '';
  if(data.expected_move){
    const em = data.expected_move;
    const lo = em.lower_btc || em.lower / bps;
    const hi = em.upper_btc || em.upper / bps;
    const range = hi - lo;
    const spotPct = Math.max(0, Math.min(100, (spot - lo) / range * 100));
    emHtml = `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;font-size:11px">
      <span style="color:var(--t2)">Expected Move (${em.dte}d)</span>
      <span style="color:var(--blue);font-weight:600">±${em.pct.toFixed(1)}%</span>
    </div>`;
    emHtml += `<div class="em-bar">
      <div class="em-fill" style="left:0;right:0;background:var(--blue)"></div>
      <div class="em-marker" style="left:${spotPct}%;background:var(--t1)"></div>
      <div class="em-label" style="left:4px;color:var(--t3)">${fB(lo)}</div>
      <div class="em-label" style="right:4px;color:var(--t3)">${fB(hi)}</div>
    </div>`;
  }

  // Range visual (positive gamma only)
  if(isPos && lv.pw && lv.cw){
    const rangeW = ((lv.cw - lv.pw) / spot * 100).toFixed(1);
    const pct = Math.max(0, Math.min(100, (spot - lv.pw) / (lv.cw - lv.pw) * 100));
    emHtml += `<div style="background:var(--bg3);border:1px solid var(--border);border-radius:4px;padding:8px 10px;margin-bottom:10px">
      <div style="display:flex;justify-content:space-between;font-size:9px;color:var(--t3);margin-bottom:4px"><span>Range ${rangeW}%</span></div>
      <div style="position:relative;height:14px;background:linear-gradient(90deg,var(--red-bg),var(--bg3) 35%,var(--bg3) 65%,var(--green-bg));border-radius:2px;border:1px solid var(--border)">
        <div style="position:absolute;top:-2px;bottom:-2px;left:${pct}%;width:2px;background:var(--blue);border-radius:1px"></div>
      </div>
      <div style="display:flex;justify-content:space-between;font-size:10px;margin-top:4px"><span style="color:var(--green)">${fB(lv.pw)}</span><span style="color:var(--red)">${fB(lv.cw)}</span></div>
    </div>`;
  }

  document.getElementById('em-bar').innerHTML = emHtml;

  // Level rows
  const rows = [
    {name:'Call Wall', color:'var(--red)', price:lv.cw},
    {name:'γ Flip', color:'var(--amber)', price:lv.gf},
    {name:'Max Pain', color:'var(--purple)', price:lv.mp},
    {name:'Put Wall', color:'var(--green)', price:lv.pw}
  ];

  // Add delta flip if available
  if(lv.deltaFlips && lv.deltaFlips.length > 0){
    lv.deltaFlips.forEach((fp, i) => {
      rows.push({name:`Δ Flip${lv.deltaFlips.length>1?' '+(i+1):''}`, color:'#c084fc', price:fp.price_btc});
    });
  }

  // Add support/resistance
  lv.support.forEach((s,i) => {
    if(s !== lv.pw) rows.push({name:`Support ${i+1}`, color:'var(--green2)', price:s});
  });
  lv.resistance.forEach((r,i) => {
    if(r !== lv.cw) rows.push({name:`Resist ${i+1}`, color:'var(--red2)', price:r});
  });

  let html = '';
  rows.forEach(r => {
    const d = dist(r.price);
    const dColor = d > 0 ? 'var(--green)' : d < 0 ? 'var(--red)' : 'var(--t3)';
    html += `<div class="level-row">
      <div class="level-dot" style="background:${r.color}"></div>
      <div class="level-name">${esc(r.name)}</div>
      <div class="level-price">${fB(r.price)}</div>
      <div class="level-dist" style="color:${dColor}">${fP(d)}</div>
    </div>`;
  });
  document.getElementById('levels-rows').innerHTML = html;
}

// ── DTE Windows ──
function renderDTEWindows(outlook){
  if(!outlook || !outlook.windows){
    document.getElementById('dte-grid').innerHTML = '<div class="dim">No outlook data</div>';
    return;
  }
  let html = '';
  outlook.windows.forEach(w => {
    const isPos = w.regime === 'positive_gamma';
    const rangeW = w.call_wall && w.put_wall && outlook.spot ? ((w.call_wall - w.put_wall) / outlook.spot * 100).toFixed(1) : '—';
    html += `<div class="dte-card">
      <div class="dte-label">${esc(w.label)}</div>
      <div class="dte-regime" style="color:${isPos?'var(--green)':'var(--red)'}">${isPos?'+GEX':'-GEX'}</div>
      <div class="dte-row"><span>PW</span><span>${w.put_wall?fB(w.put_wall):'—'}</span></div>
      <div class="dte-row"><span>CW</span><span>${w.call_wall?fB(w.call_wall):'—'}</span></div>

    </div>`;
  });
  document.getElementById('dte-grid').innerHTML = html;
}

// ── Macro Score ──
function renderMacro(macro){
  if(!macro || macro.score === undefined){
    document.getElementById('macro-hdr').innerHTML = '<span class="dim">No macro data</span>';
    document.getElementById('macro-signals').innerHTML = '';
    return;
  }

  const score = macro.score;
  const scoreColor = score > 15 ? 'var(--green)' : score < -15 ? 'var(--red)' : 'var(--t2)';
  const bias = macro.bias || 'NEUTRAL';
  const biasClass = bias === 'BOTTOMING' ? 'badge-pos' : bias === 'TOPPING' ? 'badge-neg' : 'badge-neutral';

  let hdrHtml = `<div class="macro-score" style="color:${scoreColor}">${score > 0 ? '+' : ''}${Math.round(score)}</div>`;
  hdrHtml += `<span class="badge ${biasClass}">${esc(bias)}</span>`;
  if(macro.high_conviction) hdrHtml += `<span class="badge badge-amber">HIGH CONVICTION</span>`;
  document.getElementById('macro-hdr').innerHTML = hdrHtml;

  // Signal abbreviation map
  const sigNames = {
    regime_persistence: 'Regime',
    wall_migration: 'Walls',
    range_compression: 'Range',
    etf_flow_momentum: 'ETF Flow',
    venue_convergence: 'Venues',
    funding_rate: 'Funding',
    aggregate_oi: 'Agg OI',
    liquidation: 'Liquidation',
    pcr_direction: 'PCR',
    wall_breach: 'Wall Breach',
    iv_term_structure: 'IV Term'
  };
  const cgSignals = ['funding_rate','aggregate_oi','liquidation'];

  let sigHtml = '';
  if(macro.signals){
    for(const [key, sig] of Object.entries(macro.signals)){
      const name = sigNames[key] || key;
      const s = sig.score || 0;
      const max = sig.max || 13;
      const sColor = s > 0 ? 'var(--green)' : s < 0 ? 'var(--red)' : 'var(--t3)';
      const isCg = cgSignals.includes(key);
      const available = !(isCg && !macro.coinglass_available);
      sigHtml += `<div class="signal-row">
        <span class="signal-name">${esc(name)}${isCg ? '<span class="signal-cg">CG</span>':''}</span>
        <span class="signal-score ${available?'':'dim'}" style="color:${available?sColor:'var(--t3)'}">
          ${available ? (s > 0 ? '+' : '') + Math.round(s) + '/' + max : '—'}
        </span>
      </div>`;
    }
  }
  document.getElementById('macro-signals').innerHTML = sigHtml;
}

// ── AI Analysis ──
function renderAnalysis(analysis){

    return;
  }

  let html = '';
  if(analysis._timestamp){
    html += `<div class="ai-ts">Updated ${esc(analysis._timestamp)}${analysis._btc_price ? ' · BTC ' + fB(analysis._btc_price) : ''}</div>`;
  }

  // Show analysis for selected DTE window (fallback to 0-3d in expiry mode)
  const dteKey = currentDte.startsWith('exp:') || currentDte.startsWith('range:') ? '0-3d' : currentDte + 'd';
  const dteTxt = analysis[dteKey];
  if(dteTxt){
    html += `<div class="ai-content">${formatAiText(dteTxt)}</div>`;
  }

  // Cross-timeframe

function addLine(price, color, title, w=1, s=2){

  });

// ── Expiry Options ──
function findNextMonthly(fromDate){
  for(let m=0;m<3;m++){
    const d=new Date(fromDate.getFullYear(),fromDate.getMonth()+m,1);
    const firstDow=d.getDay();
    const firstFriDay=firstDow<=5?(5-firstDow+1):(5+7-firstDow+1);
    const thirdFriDay=firstFriDay+14;
    const thirdFri=new Date(d.getFullYear(),d.getMonth(),thirdFriDay);
    if(thirdFri>=fromDate)return thirdFri.toISOString().slice(0,10);
  }
  return fromDate.toISOString().slice(0,10);
}

async function loadExpiryOptions(){
  try{
    const r = await fetch(`/api/expiry-data?ticker=${currentTicker}`);
    const d = await r.json();
    if(!d.expiries || !d.expiries.length) return;

    const now = new Date();
    now.setHours(0,0,0,0);
    expiryList = d.expiries.filter(e => e.expiry_date >= now.toISOString().slice(0,10))
      .map(e => {
        const ed = new Date(e.expiry_date + 'T12:00:00');
        const freshDte = Math.max(0, Math.round((ed - now) / 86400000));
        return {...e, dte: freshDte};
      });

    // Annotate DTE window options with expiry count + OI
    const dteWindows = [{v:'0-3',min:0,max:3},{v:'4-7',min:4,max:7},{v:'8-14',min:8,max:14},{v:'15-30',min:15,max:30},{v:'31-45',min:31,max:45}];
    for(const w of dteWindows){
      const matching = expiryList.filter(e => e.dte >= w.min && e.dte <= w.max);
      const opt = document.querySelector(`#dte-select option[value="${w.v}"]`);
      if(opt){
        if(matching.length){
          const totalOi = matching.reduce((s,e) => s + (e.total_oi||0), 0);
          opt.textContent = `${w.v}d (${matching.length} exp, ${(totalOi/1000).toFixed(0)}K)`;
        } else {
          opt.textContent = `${w.v}d`;
        }
      }
    }

    // ALL DTE annotation
    const allOpt = document.querySelector('#dte-select option[value="0-100"]');
    if(allOpt){
      const totalOi = expiryList.reduce((s,e) => s + (e.total_oi||0), 0);
      allOpt.textContent = `ALL (${expiryList.length} exp, ${(totalOi/1000).toFixed(0)}K)`;
    }

    // Single expiry options
    const expGroup = document.getElementById('dte-expiry-group');
    expGroup.innerHTML = '';
    for(const exp of expiryList){
      const dt = new Date(exp.expiry_date + 'T12:00:00');
      const mon = dt.toLocaleString('en', {month:'short'});
      const day = dt.getDate();
      const oi = ((exp.total_oi||0)/1000).toFixed(0);
      const opt = document.createElement('option');
      opt.value = `exp:${exp.expiry_date}`;
      opt.textContent = `${mon} ${day} (${exp.dte}d) ${oi}K`;
      expGroup.appendChild(opt);
    }

    // Range options
    const rangeGroup = document.getElementById('dte-range-group');
    rangeGroup.innerHTML = '';
    const today = new Date();
    today.setHours(0,0,0,0);
    const dow = today.getDay();
    const todayStr = today.toISOString().slice(0,10);

    // This week
    const thisFri = new Date(today);
    thisFri.setDate(today.getDate() + (5 - dow));
    const thisFriStr = thisFri.toISOString().slice(0,10);
    const thisWeekExps = expiryList.filter(e => e.expiry_date >= todayStr && e.expiry_date <= thisFriStr);

    // Next week
    const nextMon = new Date(today);
    nextMon.setDate(today.getDate() + (8 - dow));
    const nextFri = new Date(nextMon);
    nextFri.setDate(nextMon.getDate() + 4);
    const nextMonStr = nextMon.toISOString().slice(0,10);
    const nextFriStr = nextFri.toISOString().slice(0,10);
    const nextWeekExps = expiryList.filter(e => e.expiry_date >= nextMonStr && e.expiry_date <= nextFriStr);

    // Monthly
    const monthlyDate = findNextMonthly(today);
    const monthlyExp = expiryList.find(e => e.expiry_date === monthlyDate);

    if(thisWeekExps.length){
      const totalOi = thisWeekExps.reduce((s,e) => s + (e.total_oi||0), 0);
      const opt = document.createElement('option');
      opt.value = `range:${todayStr}:${thisFriStr}`;
      opt.textContent = `This Week (${thisWeekExps.length} exp, ${(totalOi/1000).toFixed(0)}K)`;
      rangeGroup.appendChild(opt);
    }

    if(nextWeekExps.length){
      const totalOi = nextWeekExps.reduce((s,e) => s + (e.total_oi||0), 0);
      const opt = document.createElement('option');
      opt.value = `range:${nextMonStr}:${nextFriStr}`;
      opt.textContent = `Next Week (${nextWeekExps.length} exp, ${(totalOi/1000).toFixed(0)}K)`;
      rangeGroup.appendChild(opt);
    }

    if(monthlyExp){
      const opt = document.createElement('option');
      opt.value = `exp:${monthlyDate}`;
      const md = new Date(monthlyDate + 'T12:00:00');
      opt.textContent = `Monthly ${md.toLocaleString('en',{month:'short'})} ${md.getDate()} (${monthlyExp.dte}d) ${((monthlyExp.total_oi||0)/1000).toFixed(0)}K`;
      rangeGroup.appendChild(opt);
    }

    rangeGroup.style.display = rangeGroup.children.length ? '' : 'none';
  } catch(e){ console.warn('Expiry options:', e) }
}

// ── Positioning Outlook Chart ──
function renderOutlook(data){
  const ctx = document.getElementById('outlook-chart');
  if(!ctx) return;
  const wins = data.windows;
  const spot = data.spot;
  if(!wins || !wins.length || !spot) return;

  if(outlookChart){ outlookChart.destroy(); outlookChart = null }

  const xPositions = wins.map(w => (w.min_dte + w.max_dte) / 2);
  const labels = wins.map(w => w.label);

  const point = (i, val) => val != null ? {x: xPositions[i], y: val} : null;

  const emUpperPts = wins.map((w,i) => point(i, w.em_upper)).filter(Boolean);
  const emLowerPts = wins.map((w,i) => point(i, w.em_lower)).filter(Boolean);
  const callWallPts = wins.map((w,i) => point(i, w.call_wall)).filter(Boolean);
  const putWallPts = wins.map((w,i) => point(i, w.put_wall)).filter(Boolean);
  const gammaFlipPts = wins.map((w,i) => point(i, w.gamma_flip)).filter(Boolean);
  const deltaFlipPts = wins.map((w,i) => w.delta_flip_btc ? {x:xPositions[i], y:w.delta_flip_btc} : null).filter(Boolean);
  const venueAgreeCW = wins.map((w,i) => w.venue_agree ? {x:xPositions[i], y:w.call_wall} : null).filter(Boolean);
  const venueAgreePW = wins.map((w,i) => w.venue_agree ? {x:xPositions[i], y:w.put_wall} : null).filter(Boolean);

  const allVals = [
    ...wins.map(w=>w.call_wall), ...wins.map(w=>w.put_wall),
    ...wins.map(w=>w.gamma_flip), ...wins.map(w=>w.em_upper), ...wins.map(w=>w.em_lower),
    ...wins.map(w=>w.delta_flip_btc)
  ].filter(v => v != null && isFinite(v));
  const yMin = Math.min(...allVals);
  const yMax = Math.max(...allVals);
  const yPad = (yMax - yMin) * 0.1 || 1000;

  outlookChart = new Chart(ctx, {
    type: 'line',
    data: {
      datasets: [
        {label:'EM Upper', data:emUpperPts, borderColor:'rgba(168,139,250,0.3)', borderWidth:1, borderDash:[3,4], pointRadius:0, fill:false, tension:0.3, order:10},
        {label:'EM Lower', data:emLowerPts, borderColor:'rgba(168,139,250,0.3)', borderWidth:1, borderDash:[3,4], pointRadius:0, fill:false, tension:0.3, order:10},
        {label:'Call Wall', data:callWallPts, borderColor:'rgba(255,64,96,0.85)', borderWidth:2.5, pointRadius:4, pointBackgroundColor:'rgba(255,64,96,1)', fill:false, tension:0.2, order:2},
        {label:'Put Wall', data:putWallPts, borderColor:'rgba(0,220,130,0.85)', borderWidth:2.5, pointRadius:4, pointBackgroundColor:'rgba(0,220,130,1)', fill:false, tension:0.2, order:2},
        {label:'γ Flip', data:gammaFlipPts, borderColor:'rgba(255,176,32,0.3)', borderWidth:1, borderDash:[5,3], pointRadius:2, pointBackgroundColor:'rgba(255,176,32,0.5)', fill:false, tension:0.2, order:3},
        {label:'Δ Flip', data:deltaFlipPts, borderColor:'rgba(192,132,252,0.3)', borderWidth:1, borderDash:[4,3], backgroundColor:'rgba(192,132,252,0.9)', pointRadius:4, pointStyle:'triangle', pointBorderColor:'rgba(192,132,252,1)', pointBorderWidth:1, showLine:true, fill:false, tension:0.2, order:1},
        {label:'Venue Agree', data:venueAgreeCW, borderColor:'transparent', backgroundColor:'rgba(0,220,130,0.9)', pointRadius:5, pointStyle:'rectRot', pointBorderWidth:0, showLine:false, fill:false, order:1},
        {label:'Venue Agree PW', data:venueAgreePW, borderColor:'transparent', backgroundColor:'rgba(0,220,130,0.9)', pointRadius:5, pointStyle:'rectRot', pointBorderWidth:0, showLine:false, fill:false, order:1},
      ]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      animation: {duration: 300},
      layout: {padding: {bottom: 4}},
      interaction: {mode:'nearest', intersect:false, axis:'x'},
      plugins: {
        legend: {display: false},
        tooltip: {
          backgroundColor: 'rgba(6,8,12,0.95)',
          borderColor: 'rgba(28,34,48,0.8)',
          borderWidth: 1,
          titleFont: {family:'IBM Plex Mono', size:10},
          bodyFont: {family:'IBM Plex Mono', size:10},
          padding: 8,
          callbacks: {
            title(items){
              const xVal = items[0]?.parsed?.x;
              const idx = xPositions.indexOf(xVal);
              return idx >= 0 ? labels[idx] : '';
            },
            label(item){
              const ds = item.dataset.label;
              if(ds==='EM Upper'||ds==='EM Lower') return '';
              if(ds==='Call Wall'){
                const idx = xPositions.indexOf(item.parsed?.x);
                const w = idx>=0 ? wins[idx] : null;
                return `Call Wall: ${fB(item.parsed.y)} (${w?.regime==='negative_gamma'?'NEG γ':'POS γ'})`;
              }
              if(ds==='Put Wall') return `Put Wall: ${fB(item.parsed.y)}`;
              if(ds==='γ Flip') return `γ Flip: ${fB(item.parsed.y)}`;
              if(ds==='Δ Flip') return `Δ Flip: ${fB(item.parsed.y)}`;
              if(ds==='Venue Agree') return '◆ Venues agree (CW)';
              if(ds==='Venue Agree PW') return '◆ Venues agree (PW)';
              return '';
            },
            afterBody(items){
              const xVal = items[0]?.parsed?.x;
              const idx = xPositions.indexOf(xVal);
              const w = idx>=0 ? wins[idx] : null;
              if(!w) return '';
              const lines = [];
              if(w.dealer_delta_dir) lines.push(`Dealers: net ${w.dealer_delta_dir}`);
              if(w.charm_dir) lines.push(`Charm: ${w.charm_dir}`);
              if(w.delta_flip_btc) lines.push(`Δ Flip: ${fB(w.delta_flip_btc)}`);
              return lines.join('\n');
            }
          }
        }
      },
      scales: {
        x: {
          type: 'linear', min: 0, max: 46,
          grid: {color:'rgba(28,34,48,0.3)', lineWidth:0.5},
          ticks: {
            font: {family:'IBM Plex Mono', size:9}, color:'#4a5568',
            callback(value){ const idx=xPositions.indexOf(value); return idx>=0?labels[idx]:''; },
            autoSkip: false, stepSize: 1
          },
          afterBuildTicks(axis){ axis.ticks = xPositions.map(x=>({value:x})); }
        },
        y: {
          min: Math.floor((yMin-yPad)/1000)*1000,
          max: Math.ceil((yMax+yPad)/1000)*1000,
          grid: {color:'rgba(28,34,48,0.3)', lineWidth:0.5},
          ticks: {font:{family:'IBM Plex Mono',size:9}, color:'#4a5568', callback:v=>fB(v)},
          position: 'right'
        }
      }
    },
    plugins: [{
      id: 'regimeBand',
      beforeDatasetsDraw(chart){
        const {ctx:c, chartArea:{top,bottom}, scales:{x:xScale}} = chart;
        const stripHeight = 4;
        wins.forEach((w,i) => {
          const x1 = xScale.getPixelForValue(w.min_dte);
          const x2 = xScale.getPixelForValue(w.max_dte);
          c.fillStyle = w.regime==='negative_gamma' ? 'rgba(255,64,96,0.7)' : 'rgba(0,220,130,0.7)';
          c.fillRect(x1, top, x2-x1, stripHeight);
        });
      }
    }]
  });
}

// ── WebSocket ──
function startCryptoWs(tf, wsSym){
  if(btcWs){btcWs.close();btcWs=null}
  if(!tvSeries) return;
  const wsUrls = [
    `wss://stream.binance.com:9443/ws/${wsSym}@kline_${tf}`,
    `wss://stream.binance.us:9443/ws/${wsSym}@kline_${tf}`
  ];
  let idx = 0, retryDelay = 1000;
  function connect(){
    if(idx >= wsUrls.length){
      setTimeout(() => {idx=0;connect()}, retryDelay);
      retryDelay = Math.min(retryDelay * 2, 60000);
      return;
    }
    const ws = new WebSocket(wsUrls[idx]);
    ws.onopen = () => {retryDelay = 1000};
    ws.onmessage = e => {
      try{
        const msg = JSON.parse(e.data);
        if(!msg.k) return;
        const k = msg.k;
        tvSeries.update({time:Math.floor(k.t/1000), open:+k.o, high:+k.h, low:+k.l, close:+k.c});
        const price = fB(+k.c);
        const el = document.getElementById('hero-btc');
        if(el.textContent !== price) el.textContent = price;
      }catch(err){}
    };
    ws.onerror = () => {ws.close()};
    ws.onclose = () => {if(btcWs === ws){idx++;connect()}};
    btcWs = ws;
  }
  connect();
}
